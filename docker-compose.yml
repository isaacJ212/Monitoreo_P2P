services:
  p2p-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p2p_usdt_monitor
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Si usas SQLite local, monta el archivo para persistencia.
      # Si usas Supabase (PostgreSQL en la nube), puedes omitir o comentar esta línea:
      - ./p2p_monitor.db:/app/p2p_monitor.db
    depends_on:
      - waha
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Servidor de WhatsApp WAHA (WhatsApp HTTP API)
  waha:
    image: devlikeapro/waha:latest
    container_name: waha_whatsapp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - WAHA_LOG_LEVEL=INFO
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
      # La API key debe coincidir exactamente con WAHA_API_KEY del .env
      - WAHA_API_KEY=${WAHA_API_KEY}
    volumes:
      - waha_data:/app/.sessions
      - waha_sessions:/app/.sessions

volumes:
  waha_data:
  waha_sessions:
